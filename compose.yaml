services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-platform}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U platform"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped
  orders:
    build:
      context: .
      args:
        SERVICE: orders
    environment: &service-env
      DATABASE_URL: jdbc:postgresql://postgres:5432/orders
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-platform}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on: &dependencies
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
  inventory:
    build:
      context: .
      args:
        SERVICE: inventory
    environment:
      <<: *service-env
      DATABASE_URL: jdbc:postgresql://postgres:5432/inventory
    depends_on: *dependencies
    restart: unless-stopped
  notifications:
    build:
      context: .
      args:
        SERVICE: notifications
    environment:
      <<: *service-env
      DATABASE_URL: jdbc:postgresql://postgres:5432/notifications
    depends_on: *dependencies
    restart: unless-stopped
  dashboard:
    build: ./dashboard
    ports:
      - "${HTTP_PORT:-8090}:80"
    depends_on:
      - orders
      - inventory
      - notifications
    restart: unless-stopped
volumes:
  pg-data:
  kafka-data:
