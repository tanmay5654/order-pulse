server {
 listen 80;
 server_tokens off;
 root /usr/share/nginx/html;
 resolver 127.0.0.11 valid=10s;
 location /api/orders { set $orders http://orders:8081; proxy_pass $orders; }
 location /api/stock { set $inventory http://inventory:8082; proxy_pass $inventory; }
 location /api/metrics { set $analytics http://notifications:8083; proxy_pass $analytics; }
 location / { try_files $uri /index.html; }
}
